<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLABE Interbancaria</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f6;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#222}
.card{background:#fff;max-width:520px;width:calc(100% - 32px);padding:28px;border-radius:22px;box-shadow:0 8px 30px #0001;text-align:center}
h1{color:#005c44;margin-top:0}.data{text-align:left;background:#f1f4f3;padding:18px;border-radius:14px;margin:20px 0}
.row{margin:10px 0}.label{font-weight:700;color:#005c44}
button{background:#005c44;color:#fff;border:0;border-radius:12px;padding:15px 24px;font-size:18px;font-weight:700;cursor:pointer}
#status{margin-top:14px;font-weight:700;min-height:24px}
small{color:#666}
</style>
</head>
<body>
<div class="card">
<h1>CLABE Interbancaria</h1>
<p>La CLABE puede copiarse al portapapeles automáticamente.</p>
<div class="data">
<div class="row"><span class="label">Banco:</span> Banco Azteca</div>
<div class="row"><span class="label">Nombre:</span> Ivonne Hernandez Martinez</div>
<div class="row"><span class="label">CLABE:</span> <strong id="clabe">127180001292340419</strong></div>
</div>
<button id="copy">Copiar CLABE</button>
<div id="status"></div>
<small>Gracias por su compra y preferencia</small>
</div>
<script>
const clabe="127180001292340419";
async function copiar(){
  try{
    await navigator.clipboard.writeText(clabe);
    document.getElementById("status").textContent="✓ CLABE copiada al portapapeles";
  }catch(e){
    document.getElementById("status").textContent="Pulsa “Copiar CLABE” para copiarla.";
  }
}
document.getElementById("copy").addEventListener("click",copiar);
window.addEventListener("load",()=>setTimeout(copiar,300));
</script>
</body>
</html>
